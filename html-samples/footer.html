<tangible class="live-refresh">[sbo_field name="one_footer_01_title"]</tangible>
<tangible class="live-refresh">[sbo_field name="one_business_phone"]</tangible>

<section>
	<footer>
		<div class="container py-5">
			<div class="row gy-5">
				<div class="col-sm-6 col-lg-4 ">
					<div class="lc-block mb-4 ">
						<tangible class="live-refresh">
							<a class="navbar-brand" href="{Site url}">
								<img src="[sbo_custom_logo]" width="30" height="30" class="d-inline-block align-middle me-2" alt="[sbo_field name='website_name']">
								<site name=""></site>
							</a>
						</tangible>
					</div>
					<div class="lc-block text">
						<div editable="rich">
							<p class="text-body text-opacity-75">
								<tangible class="live-refresh">[sbo_field name="one_footer_desc" raw="true"]</tangible>
							</p>
						</div>
					</div>
					<div class="lc-block hstack gap-2">
						<tangible class="live-refresh">[sbo_social_all]</tangible>
					</div>
				</div>
				<div class="col-sm-6 col-lg-2">
					<!-- First Column: Primary Menu -->
					<div class="lc-block">
						<p class="fs-6 fw-bold">
							<tangible class="live-refresh">[sbo_field name="one_footer_01_title"]</tangible>
						</p>
						<tangible class="live-refresh">
							<ul class="nav flex-column">
								<!-- SiteBuilderOne - Footer-Services -->
								<loop type="menu" menu="Footer-Services">
									<li class="nav-item "><a class="nav-link link-body ps-0" href="{Field url}">
											<field name="title"></field>
										</a></li>
								</loop>
							</ul>
						</tangible>
					</div>
				</div>
				<div class="col-sm-6 col-lg-2">
					<!-- Contact information -->
					<div class="lc-block">
						<p class="fs-6 fw-bold">
							<tangible class="live-refresh">[sbo_field name="one_footer_02_title"]</tangible>
						</p>
						<tangible class="live-refresh">
							<ul class="nav flex-column">
								<loop type="menu" menu="Footer-Contact">
									<li class="nav-item"><a class="nav-link link-body ps-0" href="{Field url}">
											<field name="title"></field>
										</a></li>
								</loop>
							</ul>
						</tangible>
					</div>
				</div>
				<div class="col-sm-6 col-lg-4 col-lg-auto text-align border">
					<div class="lc-block">
						<p class="fs-6 fw-bold">
							<tangible class="live-refresh">
								<site name=""></site>
							</tangible>
						</p>
						<div class="row my-3">
							<!-- phone number -->
							<tangible class="live-refresh">
								<a href="tel=[sbo_field name='one_phone_web_ready']" class="text-decoration-none">
									<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-telephone me-3" viewBox="0 0 16 16">
										<path d="M3.654 1.328a.678.678 0 0 0-1.015-.063L1.605 2.3c-.483.484-.661 1.169-.45 1.77a17.6 17.6 0 0 0 4.168 6.608 17.6 17.6 0 0 0 6.608 4.168c.601.211 1.286.033 1.77-.45l1.034-1.034a.678.678 0 0 0-.063-1.015l-2.307-1.794a.68.68 0 0 0-.58-.122l-2.19.547a1.75 1.75 0 0 1-1.657-.459L5.482 8.062a1.75 1.75 0 0 1-.46-1.657l.548-2.19a.68.68 0 0 0-.122-.58zM1.884.511a1.745 1.745 0 0 1 2.612.163L6.29 2.98c.329.423.445.974.315 1.494l-.547 2.19a.68.68 0 0 0 .178.643l2.457 2.457a.68.68 0 0 0 .644.178l2.189-.547a1.75 1.75 0 0 1 1.494.315l2.306 1.794c.829.645.905 1.87.163 2.611l-1.034 1.034c-.74.74-1.846 1.065-2.877.702a18.6 18.6 0 0 1-7.01-4.42 18.6 18.6 0 0 1-4.42-7.009c-.362-1.03-.037-2.137.703-2.877z"></path>
									</svg>[sbo_field name="one_business_phone"]</a>
							</tangible>
						</div>
						<!-- email 
	<i class="bi bi-envelope"></i>
	-->
						<div class="row my-3">
							<tangible class="live-refresh">
								<a href="mailto=[sbo_field name='one_business_email']" class="text-decoration-none">
									<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-envelope me-3" viewBox="0 0 16 16">
										<path d="M0 4a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2zm2-1a1 1 0 0 0-1 1v.217l7 4.2 7-4.2V4a1 1 0 0 0-1-1zm13 2.383-4.708 2.825L15 11.105zm-.034 6.876-5.64-3.471L8 9.583l-1.326-.795-5.64 3.47A1 1 0 0 0 2 13h12a1 1 0 0 0 .966-.741M1 11.105l4.708-2.897L1 5.383z" />
									</svg>[sbo_field name="one_business_email"]</a>
							</tangible>
						</div>
					</div>
				</div>
			</div>
		</div>
		<div class="py-5 container">
			<div class="row">
				<div class="col-6 small">
					<div class="lc-block">
						<tangible class="live-refresh">
							<p>Copyright ©<date format="Y"></date>
								<site name=""></site>
							</p>
						</tangible>
					</div>
				</div>
				<div class="col-6 text-end small">
					<div class="lc-block">
						<div editable="rich">
							<p>
								<a class="text-decoration-none" href="#">License Details</a> -
								<a class="text-decoration-none" href="#">Terms &amp; Conditions</a>
							</p>
						</div>
					</div>
				</div>
			</div>
		</div>
	</footer>
</section>
