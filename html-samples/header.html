<!-- sitebuilderone lite fixed header -->
 <tangible class="live-reload">
	<header class="z-fixed header-fixed-top">
          <nav class="navbar navbar-expand-lg navbar-light bg-body shadow-lg" aria-label="Primary navigation">
			<div class="container position-relative d-flex align-items-center">
				<div class="d-flex">
					<a class="navbar-brand me-0" href="https://wp-sitebuilderone-lite.local/">
						<img src="[sbo_custom_logo]" width="30" height="30" class="d-inline-block align-top" alt="[sbo_field name='website_name']">
						<span>[sbo_field name='website_name']</span>
					</a>
				</div>
				<div class="collapse navbar-collapse flex-grow-1 justify-content-center" id="mainNavbarTheme">
					<div lc-helper="shortcode" class="live-shortcode">
						[lc_nav_menu theme_location="primary" container_class="" container_id="" menu_class="navbar-nav mx-auto"]
					</div>
				</div>
				<div class="d-flex align-items-center navbar-no-collapse-items order-lg-last">
					<div class="nav-item me-2 me-lg-0">
						<a href="#" class="btn btn-sm btn-primary">
							[sbo_field name="one_cta_text"]
						</a>
					</div>
					<button class="navbar-toggler order-last" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbarTheme" aria-controls="mainNavbarTheme" aria-expanded="false" aria-label="Toggle primary navigation">
						<span class="navbar-toggler-icon">
							<i></i>
						</span>
					</button>
				</div>
			</div>
		</nav>
	</header>
</tangible>
<!-- sitebuilderone lite fixed header -->
