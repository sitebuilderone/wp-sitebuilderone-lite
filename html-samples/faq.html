<section class="faq">
	<div class="container py-5">
		<div class="row">
			<div class="col-md-3">
				<div class="lc-block mb-5 mb-md-0">
					<div editable="rich">
						<h2 class="fw-bolder">Frequently asked questions</h2>
						<p>Lorem ipsum dolor sit amet consectetur adipiscing elit sed do.</p>
					</div>
				</div>
			</div>
			<div class="col-md-7 offset-md-1">
				<tangible class="live-refresh">
					<loop type="faq" count="6">
						<div class="lc-block mb-5">
							<div editable="rich">
								<p class="h4"><field name="title"></field></p>
								<field name="content"></field>
							</div>
						</div>
					</loop>
				</tangible>
			</div>
		</div>
	</div>
</section>
[sbo_faq_schema]
